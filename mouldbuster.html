<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sporexplore: mouldbuster</title>
<style>
:root{
  --bg:#10140f; --panel:#161d17; --panel2:#1c241d; --line:#2b352c;
  --ink:#eef2ea; --dim:#9fb09a; --dim2:#77896f;
  --acc:#6fb37a; --acc2:#9fd1a4;
  --good:#7fb069; --warn:#d99a35; --bad:#c85a4a; --deadly:#a83232;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--acc2)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 18px 60px}

header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:23px;margin:0;letter-spacing:-.02em;font-weight:650;color:#ffffff}
h1 .x{color:var(--acc)}
.sub{color:var(--dim);font-size:13px;flex:1;min-width:220px}
.langpick{display:flex;align-items:center;gap:7px;flex:none}
.langpick label{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim2)}
.langpick select{width:auto;padding:5px 8px;font-size:13px}
.warnbar{
  margin:14px 0 18px;padding:10px 13px;border-radius:var(--r);
  background:var(--panel2);border:1px solid var(--acc);color:var(--ink);font-size:12.5px;line-height:1.5
}
.warnbar strong{color:var(--acc2)}
.langbar{
  margin:0 0 18px;padding:10px 13px;border-radius:var(--r);
  background:#1a2229;border:1px solid #2d3f4c;color:#a8c6d9;font-size:12.5px;line-height:1.5;display:none
}
.langbar strong{color:#d0e4f0}

.layout{display:grid;grid-template-columns:335px 1fr;gap:18px;align-items:start}
@media(max-width:940px){.layout{grid-template-columns:1fr}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.card + .card{margin-top:14px}
.card h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim);
  margin:0 0 11px;font-weight:600}

label.f{display:block;font-size:12px;color:var(--dim);margin:0 0 4px}
.row{display:flex;gap:9px}
.row > *{flex:1;min-width:0}
input[type=number],select{
  width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:7px 9px;font:inherit;font-size:14px
}
input:focus,select:focus{outline:none;border-color:var(--acc)}
.fld{margin-bottom:11px}

.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{
  background:var(--panel2);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:3.5px 10px;font-size:12px;cursor:pointer;user-select:none;
  transition:.12s
}
.chip:hover{border-color:var(--dim2);color:var(--ink)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--bg);font-weight:600}

.btn{
  width:100%;background:var(--acc);color:var(--bg);border:0;border-radius:8px;
  padding:9px;font:inherit;font-weight:650;cursor:pointer;font-size:14px
}
.btn:hover{background:var(--acc2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:var(--dim2)}

.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px;flex-wrap:wrap;gap:10px 16px}
.rhead h2{margin:0}
.rcount{font-size:12.5px;color:var(--dim)}

.threshold{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--dim)}
.threshold label{white-space:nowrap}
.threshold input[type=range]{
  -webkit-appearance:none;appearance:none;width:120px;height:4px;border-radius:3px;
  outline:none;cursor:pointer;background:var(--line);
}
.threshold input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--acc);cursor:pointer;border:2px solid var(--bg);box-shadow:0 0 0 1px var(--acc);
}
.threshold input[type=range]::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--acc);cursor:pointer;
  border:2px solid var(--bg);box-shadow:0 0 0 1px var(--acc)
}
.threshold #minMatchVal{color:var(--ink);font-weight:650;font-variant-numeric:tabular-nums;min-width:32px}

.hit{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.12s
}
.hit:hover{border-color:var(--dim2)}
.hit.open{border-color:var(--acc)}
.hrow{display:flex;align-items:center;gap:11px}
.rank{font-size:12px;color:var(--dim2);width:20px;flex:none;font-variant-numeric:tabular-nums}
.spicon{flex:none;display:flex;align-items:center;line-height:0}
.spicon-svg{display:block}
.nm{flex:1;min-width:0}
.nm .sci{font-style:italic;font-weight:600;font-size:15px}
.nm .au{font-style:normal;font-weight:400;color:var(--dim2);font-size:12px}
.nm .dk{font-size:12.5px;color:var(--dim);margin-top:1px}
.nm .vn{font-size:12.5px;color:var(--acc2);font-style:normal;font-weight:600}
.nm .nolocal{font-size:11.5px;color:var(--dim2);font-style:italic}

.score{flex:none;text-align:right;width:96px}
.sval{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.sbar{height:4px;background:var(--panel2);border-radius:3px;margin-top:3px;overflow:hidden}
.sfill{height:100%;border-radius:3px}

.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
.ed{font-size:11px;padding:2px 7px;border-radius:5px;font-weight:600}
.ed.edible{background:#1e2a1a;color:#a7cd94;border:1px solid #3d5c33}
.ed.caution{background:#2a2419;color:#d9bd8a;border:1px solid #5c4c2e}
.ed.toxic{background:#2a1a19;color:#e39a8f;border:1px solid #6b3430}
.ed.deadly{background:#3d1512;color:#ff9d90;border:1px solid #8a2f28;font-weight:700}

.detail{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:none}
.hit.open .detail{display:block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:11px}
.dk2{font-size:11px;color:var(--dim2);text-transform:uppercase;letter-spacing:.05em}
.dv{font-size:13px;margin-top:2px}
.note{font-size:13px;color:var(--dim);background:var(--panel2);padding:9px 11px;
  border-radius:7px;border-left:2px solid var(--acc);margin-bottom:11px}
.srcline{font-size:11.5px;color:var(--dim2);margin-bottom:10px}

.micro{margin-top:10px;margin-bottom:11px}
.mgrid{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.mchip{font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--panel2);
  border:1px solid var(--line);color:var(--dim)}
.mchip.species{border-color:#4a5c33;color:#c3d9a8;background:#1d2419}
.quote{font-size:12px;color:var(--dim);font-style:italic;margin-top:7px;
  padding-left:9px;border-left:2px solid var(--line)}
.prov{font-size:11px;color:var(--dim2);margin-top:6px;line-height:1.45}

.vtable{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;margin-top:6px}
.vtable .vl{color:var(--dim2);white-space:nowrap}
.vtable .vv{color:var(--ink)}
.vtable .vv.none{color:var(--dim2);font-style:italic}

.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-top:7px}
.ph{background:var(--panel2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
  display:block;text-decoration:none;color:inherit}
.ph:hover{border-color:var(--acc)}
.ph img{width:100%;height:110px;object-fit:cover;display:block;background:var(--bg)}
.ph .cap{padding:5px 7px;font-size:10.5px;color:var(--dim2);line-height:1.35}
.ph .cap b{color:var(--dim);font-weight:600;display:block}
.phnote{font-size:11.5px;color:var(--dim2);margin-top:7px;line-height:1.45}
.phmsg{font-size:12.5px;color:var(--dim);padding:10px 0}

.empty{padding:32px;text-align:center;color:var(--dim);background:var(--panel);
  border:1px dashed var(--line);border-radius:var(--r)}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12px;color:var(--dim2);line-height:1.6}
footer a{color:var(--dim)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Spore<span class="x">x</span>plore: mouldbuster</h1>
    <span class="sub" id="subtitle"></span>
    <div class="langpick">
      <label for="lang">Language</label>
      <select id="lang">
        <option value="eng">English</option>
        <option value="dan">Dansk</option>
        <option value="swe">Svenska</option>
        <option value="nob">Norsk (bokmål)</option>
        <option value="fin">Suomi</option>
        <option value="kal">Kalaallisut</option>
        <option value="fao">Føroyskt</option>
      </select>
    </div>
  </header>

  <div class="warnbar" id="warnbar"></div>
  <div class="langbar" id="langbar"></div>

  <div class="layout">
    <div>
      <div class="card">
        <h2 id="lbl-query"></h2>

        <div class="fld">
          <label class="f" id="lbl-genus"></label>
          <select id="genus">
            <option value="">·</option>
            <option value="Penicillium">·</option>
            <option value="Aspergillus">·</option>
          </select>
        </div>

        <div class="fld">
          <label class="f" id="lbl-len"></label>
          <div class="row">
            <input type="number" id="cLenLo" step="0.1" min="1" max="10">
            <input type="number" id="cLenHi" step="0.1" min="1" max="10">
          </div>
        </div>

        <div class="fld">
          <label class="f" id="lbl-wid"></label>
          <div class="row">
            <input type="number" id="cWidLo" step="0.1" min="1" max="10">
            <input type="number" id="cWidHi" step="0.1" min="1" max="10">
          </div>
        </div>

        <div class="fld">
          <label class="f" id="lbl-shape"></label>
          <select id="cShape">
            <option value="">·</option>
            <option value="globose">·</option>
            <option value="subglobose">·</option>
            <option value="ellipsoidal">·</option>
          </select>
        </div>

        <div class="fld">
          <label class="f" id="lbl-orn"></label>
          <select id="cOrn">
            <option value="">·</option>
            <option value="smooth">·</option>
            <option value="finely-rough">·</option>
            <option value="echinulate">·</option>
          </select>
        </div>

        <div class="fld">
          <label class="f" id="lbl-colour"></label>
          <select id="colColor">
            <option value="">·</option>
            <option value="blue-green">·</option>
            <option value="yellow-green">·</option>
            <option value="black">·</option>
            <option value="variable">·</option>
          </select>
        </div>

        <div class="fld">
          <label class="f" id="lbl-growth"></label>
          <select id="growth">
            <option value="">·</option>
            <option value="slow">·</option>
            <option value="moderate">·</option>
            <option value="fast">·</option>
          </select>
        </div>

        <div class="fld">
          <label class="f" id="lbl-substrate"></label>
          <div class="chips" id="substrateChips">
            <div class="chip" data-value="wallpaper"></div>
            <div class="chip" data-value="wood"></div>
            <div class="chip" data-value="gypsum"></div>
            <div class="chip" data-value="hvac"></div>
            <div class="chip" data-value="food"></div>
            <div class="chip" data-value="grout"></div>
          </div>
        </div>

        <div class="fld">
          <label class="f" id="lbl-thermo"></label>
          <select id="thermo">
            <option value="">·</option>
            <option value="yes">·</option>
            <option value="no">·</option>
          </select>
        </div>

        <button class="btn ghost" id="resetBtn"></button>
      </div>
    </div>

    <div>
      <div class="card">
        <div class="rhead">
          <h2><span id="lbl-candidates"></span> <span class="rcount" id="resultCount"></span></h2>
          <div class="threshold">
            <label for="minMatch" id="lbl-minmatch"></label>
            <input type="range" id="minMatch" min="0" max="95" value="25">
            <span id="minMatchVal">25%</span>
          </div>
        </div>
        <div id="results"></div>
      </div>
    </div>
  </div>

  <footer id="footer"></footer>

</div>

<script>

                           translated; everything else falls back to English via

  langNoteNoNames:"<strong>Note.</strong> GBIF holds no vernacular name in this language for most species here — those appear under their scientific name, which is the correct way to refer to them.",
  footer:"Colony and microscopy figures compiled from standard mycological references (Pitt &amp; Hocking, <i>Fungi and Food Spoilage</i>; Samson et al., <i>Food and Indoor Fungi</i>) and cross-checked against <a href=\"https://mycology.adelaide.edu.au/fungal-descriptions-and-antifungal-susceptibility/hyphomycetes-conidial-moulds/aspergillus\" target=\"_blank\">Mycology Online (Adelaide)</a> and <a href=\"https://drfungus.org/knowledge-base/aspergillus-versicolor/\" target=\"_blank\">DoctorFungus</a>.<br><br><b>On names.</b> Every vernacular name in this app comes from the GBIF vernacular-name API (<code>/species/{key}/vernacularNames</code>), retrieved 14 Aug 2026, and is shown only for the language GBIF records it under. Where GBIF holds no name, the app says so and shows the scientific name — no name has been translated, adapted or invented. Species-level names for these microfungi are genuinely sparse: there are none at all in Danish, Finnish, Greenlandic or Faroese, and only scattered Swedish and Norwegian ones. Genus-level names do exist in Danish and Swedish and are shown as such.<br><br><b>On descriptions.</b> The UI is translated into all seven languages, but the scientific descriptions stay in English throughout. Machine-translating ~290 technical mycological phrases into six languages without a way to verify them is exactly how wrong names get into an app in the first place.<br><br>Photos are hotlinked from openly-licensed collections — CDC Public Health Image Library (public domain) and iNaturalist / GBIF / Mushroom Observer / Landcare Research NZ (CC BY or CC BY-NC, credited per image). Freely-licensed photographs specifically on MEA, CYA or V8 agar could not be found for most species; where the medium is known it is stated in the caption."

/* ---------------- Name resolution ---------------- */
// Returns the verified vernacular names for a species in the active language,
// or [] if GBIF holds none. Never derives a name from another language.
function vernFor(sp, lang){
  const v = sp.vern && sp.vern[lang];
  return Array.isArray(v) ? v : [];
}
function genusVernFor(sp, lang){
  const g = GENUS_VERN[sp.genus];
  const v = g && g[lang];
  return Array.isArray(v) ? v : [];
}

/* ---------------- Pure scoring function ---------------- */
function score(sp, Q){
  let total = 0, weight = 0;
  function add(w, s){ weight += w; total += w * Math.max(0, Math.min(1, s)); }

  if (Q.genus){ add(3, sp.genus === Q.genus ? 1 : 0); }
  if (Q.cShape){
    const fam = sp.conidia.shape.split("-");
    add(2, fam.includes(Q.cShape) ? 1 : 0.15);
  }
  if (Q.cOrn){
    let match = 0;
    if (Q.cOrn === "smooth") match = sp.conidia.orn.includes("smooth") ? 1 : 0.1;
    if (Q.cOrn === "finely-rough") match = sp.conidia.orn.includes("finely-rough") ? 1 : (sp.conidia.orn==="echinulate"?0.3:0.15);
    if (Q.cOrn === "echinulate") match = sp.conidia.orn === "echinulate" ? 1 : 0.1;
    add(2, match);
  }
  if (Q.colColor){ add(2, sp.colony.color === Q.colColor ? 1 : 0.1); }
  if (Q.growth){ add(1.5, sp.colony.growth === Q.growth ? 1 : 0.25); }
  if (Q.thermo){ add(1.5, (sp.thermo === (Q.thermo === "yes")) ? 1 : 0); }
  if (Q.substrate && Q.substrate.length){
    const hits = Q.substrate.filter(s => sp.substrate.includes(s)).length;
    add(2.5, hits / Q.substrate.length);
  }
  if (Q.cLenLo != null || Q.cLenHi != null){
    add(3, rangeMatch(Q.cLenLo, Q.cLenHi, sp.conidia.lenLo, sp.conidia.lenHi));
  }
  if (Q.cWidLo != null || Q.cWidHi != null){
    add(3, rangeMatch(Q.cWidLo, Q.cWidHi, sp.conidia.widLo, sp.conidia.widHi));
  }

  if (weight === 0) return 0.4;
  return total / weight;
}

// 75% overlap-fraction + 25% centredness. gap clamped at 0, else touching
// intervals produce a negative gap and inflate the score past 1.
function rangeMatch(qLo, qHi, x, y){
  const lo = qLo != null ? qLo : x;
  const hi = qHi != null ? qHi : y;
  const overlap = Math.max(0, Math.min(hi, y) - Math.max(lo, x));
  const overlapFrac = overlap / Math.max(1e-6, (y - x));
  const gap = Math.max(0, lo - y, x - hi);
  const centered = gap === 0 ? 1 : Math.max(0, 1 - gap / Math.max(1, (hi - lo)));
  return 0.75 * overlapFrac + 0.25 * centered;
}

/* ---------------- Query reading ---------------- */
function readQuery(){
  const num = v => v === "" || v == null ? null : parseFloat(v);
  const substrate = Array.from(document.querySelectorAll('#substrateChips .chip.on')).map(c => c.dataset.value);
  return {
    genus: document.getElementById('genus').value,
    cShape: document.getElementById('cShape').value,
    cOrn: document.getElementById('cOrn').value,
    colColor: document.getElementById('colColor').value,
    growth: document.getElementById('growth').value,
    thermo: document.getElementById('thermo').value,
    cLenLo: num(document.getElementById('cLenLo').value),
    cLenHi: num(document.getElementById('cLenHi').value),
    cWidLo: num(document.getElementById('cWidLo').value),
    cWidHi: num(document.getElementById('cWidHi').value),
    substrate
  };
}

/* ---------------- Icon ---------------- */
let ICON_SEQ = 0;
function conidiaIconSVG(sp, w, h){
  const id = 'ic' + (ICON_SEQ++);
  const colorMap = { "blue-green":"#5a8f6b", "yellow-green":"#9aa84a", "black":"#33302c", "variable":"#b98a6a" };
  const fill = colorMap[sp.colony.color] || "#7a8a72";
  const cx = w/2, cy = h/2;
  let body = "";
  if (sp.genus === "Penicillium"){
    const stemTop = cy - 4;
    body += `<line x1="${cx}" y1="${h-4}" x2="${cx}" y2="${stemTop}" stroke="var(--dim)" stroke-width="1.4"/>`;
    const n = 5;
    for(let i=0;i<n;i++){
      const angle = -Math.PI/2 + (i-(n-1)/2)*0.42;
      const x2 = cx + Math.sin(angle)*13;
      const y2 = stemTop - Math.cos(angle)*13;
      body += `<line x1="${cx}" y1="${stemTop}" x2="${x2}" y2="${y2}" stroke="var(--dim)" stroke-width="1.1"/>`;
      body += `<circle cx="${x2}" cy="${y2}" r="2.1" fill="${fill}" clip-path="url(#${id})"/>`;
    }
  } else {
    const vy = cy - 2;
    body += `<line x1="${cx}" y1="${h-4}" x2="${cx}" y2="${vy}" stroke="var(--dim)" stroke-width="1.4"/>`;
    body += `<ellipse cx="${cx}" cy="${vy}" rx="6" ry="7" fill="none" stroke="var(--dim)" stroke-width="1"/>`;
    const n = 9;
    for(let i=0;i<n;i++){
      const angle = (i/n)*Math.PI*2;
      const x2 = cx + Math.cos(angle)*11;
      const y2 = vy + Math.sin(angle)*11;
      body += `<circle cx="${x2}" cy="${y2}" r="1.8" fill="${fill}" clip-path="url(#${id})"/>`;
    }
  }
  return `<svg class="spicon-svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <defs><clipPath id="${id}"><rect x="0" y="0" width="${w}" height="${h}"/></clipPath></defs>
    ${body}
  </svg>`;
}

/* ---------------- Rendering ---------------- */
let expandedId = null;

function growthLabel(g){ return {slow:t("gSlow"), moderate:t("gMod"), fast:t("gFast")}[g] || g; }

function scoreColor(s){
  if (s >= 0.7) return "var(--good)";
  if (s >= 0.4) return "var(--acc)";
  return "var(--dim2)";
}

function galleryHTML(images, emptyMsg){
  if (!images || !images.length) return `<div class="phmsg">${emptyMsg}</div>`;
  return `<div class="photos">${images.map(img => `
    <a class="ph" href="${img.page}" target="_blank" rel="noopener">
      <img src="${img.url}" alt="${img.label}" loading="lazy" referrerpolicy="no-referrer">
      <div class="cap"><b>${img.label}</b>${img.credit} · ${img.license}</div>
    </a>`).join('')}</div>`;
}

function sevBadge(sp){
  const label = {edible:t("sevLow"), caution:t("sevModerate"), toxic:t("sevToxic"), deadly:t("sevClinical")}[sp.sev] || "";
  return `<span class="ed ${sp.sev}">${label}</span>`;
}

const VERN_LANGS = [
  {code:"eng", label:"English"}, {code:"dan", label:"Dansk"}, {code:"swe", label:"Svenska"},
  {code:"nob", label:"Norsk"}, {code:"fin", label:"Suomi"},
  {code:"kal", label:"Kalaallisut"}, {code:"fao", label:"Føroyskt"}
];

function vernTableHTML(sp){
  return `<div class="vtable">${VERN_LANGS.map(l => {
    const names = vernFor(sp, l.code);
    const gnames = genusVernFor(sp, l.code);
    let val;
    if (names.length) val = `<span class="vv">${names.join(", ")}</span>`;
    else if (gnames.length) val = `<span class="vv none">${t("noVern")} — <i>${sp.genus}</i> = ${gnames.join(", ")} (${t("genusName")})</span>`;
    else val = `<span class="vv none">${t("noVern")}</span>`;
    return `<span class="vl">${l.label}</span>${val}`;
  }).join("")}</div>`;
}

        ${micro.map(m => `<span class="mchip species">${m.k}: ${m.v}</span>`).join('')}
      </div>
      <div class="quote">${sp.conidia.shape.replace('-',' / ')} conidia, ${sp.conidia.orn.replace('-',' ')}. ${sp.conidia.colorText}</div>
    </div>

    <div class="note">${sp.health}</div>

    <div class="dk2" style="margin-bottom:6px;">${t("dEcology")}</div>
    <div style="font-size:12.5px;color:var(--dim);margin-bottom:11px;">${sp.ecology}</div>

    <div class="dk2" style="margin-bottom:2px;">${t("dMacro")}</div>
    ${galleryHTML(sp.images && sp.images.macro, t("noMacro"))}

    <div class="dk2" style="margin:11px 0 2px;">${t("dMicro")}</div>
    ${galleryHTML(sp.images && sp.images.micro, t("noMicro"))}
    <div class="phnote">${t("photoNote")}<br>${t("proseNote")}</div>
  `;
}

function render(){
  const Q = readQuery();
  const minMatch = parseInt(document.getElementById('minMatch').value, 10) / 100;
  document.getElementById('minMatchVal').textContent = document.getElementById('minMatch').value + '%';

  const scored = SPECIES.map(sp => ({sp, s: score(sp, Q)}))
    .filter(r => r.s >= minMatch)
    .sort((a,b) => b.s - a.s || a.sp.epithet.localeCompare(b.sp.epithet));

  const resultsEl = document.getElementById('results');
  document.getElementById('resultCount').textContent = scored.length + ' / ' + SPECIES.length;

  if (expandedId && !scored.find(r => r.sp.id === expandedId)) expandedId = null;

  if (!scored.length){
    resultsEl.innerHTML = `<div class="empty">${t("empty")}</div>`;
  } else {
    resultsEl.innerHTML = scored.map((r, i) => {
      const isOpen = r.sp.id === expandedId;
      const pct = Math.round(r.s*100);
      const col = scoreColor(r.s);
      const names = vernFor(r.sp, LANG);
      // Scientific name is always the primary label. A vernacular name is shown
      // only where GBIF actually records one for the active language.
      const nameLine = names.length
        ? `<span class="vn">${names[0]}</span> <span class="au">— <i>${r.sp.genus} ${r.sp.epithet}</i></span>`
        : `<i>${r.sp.genus} ${r.sp.epithet}</i>${LANG==="eng" ? ` <span class="au">— ${r.sp.descriptor}</span>` : ` <span class="nolocal">— ${t("noVern")}</span>`}`;
      return `
      <div class="hit ${isOpen?'open':''}" data-id="${r.sp.id}">
        <div class="hrow">
          <div class="rank">${i+1}</div>
          <div class="spicon">${conidiaIconSVG(r.sp, 34, 34)}</div>
          <div class="nm">
            <div class="sci">${nameLine}</div>
            <div class="dk">${growthLabel(r.sp.colony.growth)} · ${r.sp.conidia.lenLo}–${r.sp.conidia.lenHi} × ${r.sp.conidia.widLo}–${r.sp.conidia.widHi} µm</div>
          </div>
          <div class="score">
            <div class="sval" style="color:${col}">${pct}%</div>
            <div class="sbar"><div class="sfill" style="width:${pct}%;background:${col}"></div></div>
          </div>
        </div>
        <div class="detail">
          ${detailHTML(r.sp)}
          <div class="tags">${sevBadge(r.sp)}${r.sp.thermo?`<span class="tag">${t("thermoTag")}</span>`:''}</div>
        </div>
      </div>`;
    }).join('');
  }

  resultsEl.querySelectorAll('.hit').forEach(el => el.querySelector('.hrow').addEventListener('click', () => {
    const id = el.dataset.id;
    expandedId = (expandedId === id) ? null : id;
    render();
    if (expandedId) document.querySelector(`.hit[data-id="${id}"]`).scrollIntoView({behavior:'smooth', block:'nearest'});
  }));
}

/* ---------------- Static UI text ---------------- */
function setOpts(id, pairs){
  const el = document.getElementById(id);
  pairs.forEach((txt, i) => { if (el.options[i]) el.options[i].textContent = txt; });
}

function applyLanguage(){
  document.documentElement.lang = {eng:"en",dan:"da",swe:"sv",nob:"nb",fin:"fi",kal:"kl",fao:"fo"}[LANG] || "en";
  document.getElementById('subtitle').textContent = t("subtitle");
  document.getElementById('warnbar').innerHTML = `<strong>${t("warnTitle")}</strong> ${t("warnBody")}`;

  const lb = document.getElementById('langbar');
  let note = "";
  if (LANG === "kal") note = t("langNoteKal");
  else if (LANG === "fao") note = t("langNoteFao");
  else if (I18N[LANG] && I18N[LANG].langNoteNoNames) note = I18N[LANG].langNoteNoNames;
  else if (LANG === "eng") note = t("langNoteNoNames");
  if (note){ lb.innerHTML = note; lb.style.display = "block"; } else { lb.style.display = "none"; }

  document.getElementById('lbl-query').textContent = t("query");
  document.getElementById('lbl-genus').textContent = t("genus");
  setOpts('genus', [t("anyUnsure"), t("penOpt"), t("aspOpt")]);
  document.getElementById('lbl-len').textContent = t("sporeLen");
  document.getElementById('lbl-wid').textContent = t("sporeWid");
  ['cLenLo','cWidLo'].forEach(id => document.getElementById(id).placeholder = t("min"));
  ['cLenHi','cWidHi'].forEach(id => document.getElementById(id).placeholder = t("max"));
  document.getElementById('lbl-shape').textContent = t("shape");
  setOpts('cShape', [t("any"), t("globose"), t("subglobose"), t("ellipsoidal")]);
  document.getElementById('lbl-orn').textContent = t("orn");
  setOpts('cOrn', [t("any"), t("ornSmooth"), t("ornFine"), t("ornEchin")]);
  document.getElementById('lbl-colour').textContent = t("colour");
  setOpts('colColor', [t("any"), t("colBlueGreen"), t("colYellowGreen"), t("colBlack"), t("colVariable")]);
  document.getElementById('lbl-growth').textContent = t("growth");
  setOpts('growth', [t("any"), t("growthSlow"), t("growthMod"), t("growthFast")]);
  document.getElementById('lbl-substrate').textContent = t("substrate");
  const subMap = {wallpaper:"subWallpaper", wood:"subWood", gypsum:"subGypsum", hvac:"subHvac", food:"subFood", grout:"subGrout"};
  document.querySelectorAll('#substrateChips .chip').forEach(c => { c.textContent = t(subMap[c.dataset.value]); });
  document.getElementById('lbl-thermo').textContent = t("thermo");
  setOpts('thermo', [t("any"), t("yes"), t("no")]);
  document.getElementById('resetBtn').textContent = t("reset");
  document.getElementById('lbl-candidates').textContent = t("candidates");
  document.getElementById('lbl-minmatch').textContent = t("minMatch");
  document.getElementById('footer').innerHTML = t("footer");
  render();
}

/* ---------------- Wire up ---------------- */
document.querySelectorAll('#genus, #cShape, #cOrn, #colColor, #growth, #thermo, #cLenLo, #cLenHi, #cWidLo, #cWidHi, #minMatch').forEach(el => {
  el.addEventListener('input', render);
  el.addEventListener('change', render);
});
document.getElementById('substrateChips').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  chip.classList.toggle('on');
  render();
});
document.getElementById('lang').addEventListener('change', (e) => {
  LANG = e.target.value;
  applyLanguage();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  document.querySelectorAll('.layout select').forEach(s => s.value = '');
  document.querySelectorAll('#substrateChips .chip').forEach(c => c.classList.remove('on'));
  document.querySelectorAll('.layout input[type=number]').forEach(n => n.value = '');
  document.getElementById('minMatch').value = 25;
  render();
});

(function init(){
  // Honour the browser's preferred language on first load, if we support it.
  const browser = (navigator.language || "").slice(0,2).toLowerCase();
  const map = {en:"eng", da:"dan", sv:"swe", nb:"nob", nn:"nob", no:"nob", fi:"fin", kl:"kal", fo:"fao"};
  if (map[browser] && I18N[map[browser]]) LANG = map[browser];
  document.getElementById('lang').value = LANG;
  applyLanguage();
})();
</script>
</body>
</html>
