<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sporexplore — spore identifier for Nordic Boletales</title>
<meta name="description" content="Rank Nordic Boletales by spore measurements and morphology. Every spore value is sourced and cited (APA 7).">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400;1,6..72,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sporexplore/app.css">
<script>try{const t=localStorage.getItem('sporex-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/identify" style="text-decoration:none;color:inherit">
      <b>Sporexplore</b>
      <span>Spore identifier for Nordic Boletales</span>
    </a>
    <nav class="tabs" aria-label="Sections">
      <a href="#/identify" data-tab="identify">Identify</a>
      <a href="#/browse" data-tab="browse">Browse species</a>
      <a href="#/compare" data-tab="compare">Compare<span class="count" id="pinCount">0</span></a>
      <a href="#/sources" data-tab="sources">Sources &amp; method</a>
    </nav>
    <div class="tools">
      <button class="iconbtn" id="themeBtn" type="button">Light sheet</button>
    </div>
  </div>
</header>

<main id="main" tabindex="-1">
  <noscript><p>Sporexplore needs JavaScript to rank species.</p></noscript>
</main>

<footer id="foot"></footer>

<script src="sporexplore/data.js"></script>
<script src="sporexplore/app.js"></script>
</body>
</html>
