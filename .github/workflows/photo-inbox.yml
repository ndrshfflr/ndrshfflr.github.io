# Files photos sent from the iPhone Shortcut (PHOTO-UPLOAD-GUIDE.md) and keeps
# location data out of every photo on the site.
#
# - Photos land in images/inbox/; src/photo_inbox.py shrinks them, strips their
#   EXIF (GPS location included), moves them to images/gallery/ and adds them to
#   the top of content/gallery.json with the caption and weight you typed.
# - A new find sent from the upload page is added to the field log
#   (content/fieldlog.json), and the field-log sync is started so the species
#   shows up in /admin's species lists right away.
# - Photos uploaded through /admin (images/gallery, images/uploads, images/blog)
#   get their GPS location removed too; very large ones are shrunk.
#
# Runs whenever photos are pushed to main, and on demand:
# GitHub → Actions → "Photo inbox" → "Run workflow".
name: Photo inbox

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["images/inbox/**", "images/gallery/**", "images/uploads/**", "images/blog/**"]

permissions:
  contents: write
  pages: write
  actions: write   # to start the field-log sync after a new find

concurrency:
  group: photo-inbox
  cancel-in-progress: false

jobs:
  file:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the commit messages carry the captions

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: pip install pillow pillow-heif piexif

      - name: File new photos, remove location data
        env:
          PHOTO_INBOX_SUMMARY: /tmp/photo-inbox-summary.txt
        run: python3 src/photo_inbox.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- images content/gallery.json content && ! git ls-files --others --exclude-standard -- images | grep -q .; then
            echo "Nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "photo-inbox"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images content
          if git diff --cached --quiet -- content/fieldlog.json; then echo "finds=false" >> "$GITHUB_OUTPUT"; else echo "finds=true" >> "$GITHUB_OUTPUT"; fi
          { echo "Photos: file new photos, remove location data"; echo; cat /tmp/photo-inbox-summary.txt; } > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break
            sleep 5
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made by this workflow don't always trigger a Pages rebuild on
      # their own, so ask for one explicitly.
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request not accepted; the next commit will publish it."

      # A push made by a workflow doesn't start other workflows, so start the
      # field-log sync by hand: it puts the new species into /admin's lists.
      - name: Start the field-log sync
        if: steps.commit.outputs.finds == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-observations.yml --ref main || echo "Couldn't start the sync; it runs tonight anyway."
