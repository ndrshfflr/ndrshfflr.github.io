# Pulls your observations from iNaturalist, Svampeatlas, Arter.dk and DOFbasen
# into content/observations.json, which the field log page (fieldlog.html) shows.
#
# Runs every night, whenever the field-log settings are published from the CMS,
# and on demand: GitHub → Actions → "Sync field log" → "Run workflow".
name: Sync field log

on:
  schedule:
    - cron: "17 3 * * *"        # 03:17 UTC every night
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["content/fieldlog.json", "content/imports/**", "src/sync_observations.py"]

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-observations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch observations
        run: python3 src/sync_observations.py

      - name: Commit if anything changed
        id: commit
        run: |
          if git diff --quiet -- content/observations.json content/imports && ! git ls-files --others --exclude-standard -- content/observations.json | grep -q .; then
            echo "Nothing new."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "field-log-sync"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/observations.json
          git add content/imports 2>/dev/null || true
          git commit -m "Field log: sync observations"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made by this workflow don't always trigger a Pages rebuild on
      # their own, so ask for one explicitly.
      - name: Ask GitHub Pages to rebuild
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request not accepted; the next commit will publish it."
