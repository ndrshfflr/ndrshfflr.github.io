# Sporexplore data harvest — pulls raw records from GBIF, Index Fungorum /
# Species Fungorum, Danmarks Svampeatlas and Crossref and commits them, unmodified,
# to data/sporexplore/raw/ on the same branch. Runs only on the
# sporexplore-revamp branch (never on main, so it never builds or deploys the site).
name: Sporexplore harvest

on:
  workflow_dispatch:
  push:
    branches: [sporexplore-revamp]
    paths: ["data/sporexplore/requests/**", "src/sporexplore/harvest.py"]

permissions:
  contents: write

concurrency:
  group: sporexplore-harvest
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Harvest
        run: HARVEST_PARTS="$(cat data/sporexplore/requests/parts.txt)" python3 src/sporexplore/harvest.py
      - name: Commit raw data
        run: |
          git config user.name "sporexplore-harvest"
          git config user.email "actions@users.noreply.github.com"
          git add data/sporexplore/raw
          git diff --cached --quiet && exit 0
          git commit -m "Sporexplore harvest: raw data $(date -u +%F) [$(cat data/sporexplore/requests/parts.txt)]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
