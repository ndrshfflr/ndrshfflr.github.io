backend:
  name: github
  repo: ndrshfflr/ndrshfflr.github.io
  branch: main
  # Replace with your own deployed OAuth proxy URL (see setup guide).
  base_url: https://decap-proxy.shhflr.workers.dev
  auth_endpoint: auth

# Where images go by default when uploaded through the CMS.
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "home"
    label: "Main Page"
    files:
      - file: "content/home.json"
        label: "Main Page — English"
        name: "home"
        format: "json"
        fields: &homefields
          - label: "Navigation menu labels"
            name: "nav"
            widget: "object"
            hint: "The links in the top menu. These stay pointed at the same sections — you're only changing the visible label text. (The CV link appears automatically from Extra Pages.)"
            fields:
              - { label: "\"About\" label", name: "about", widget: "string" }
              - { label: "\"Indoor Microbiology\" label", name: "microbiology", widget: "string" }
              - { label: "\"Projects\" label", name: "projects", widget: "string" }
              - { label: "\"Mycology\" label", name: "mycology", widget: "string" }
              - { label: "\"Contact\" label", name: "contact", widget: "string" }

          - label: "Hero (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background photo", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Landscape, about 2000 px wide and under ~500 KB. The left/bottom is darkened so the headline stays readable. On the Danish page, leave empty to use the English photo." }
              - { label: "Photo description (for screen readers)", name: "imageAlt", widget: "string", required: false, hint: "e.g. Fruiting bodies of … on a beech log" }
              - { label: "Small label above headline", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Paragraph under headline", name: "lead", widget: "text" }
              - { label: "Primary button text", name: "primaryCtaLabel", widget: "string" }
              - { label: "Primary button link", name: "primaryCtaLink", widget: "string", hint: "e.g. #contact or a full https:// link" }
              - { label: "Secondary button text", name: "secondaryCtaLabel", widget: "string" }
              - { label: "Secondary button link", name: "secondaryCtaLink", widget: "string" }
              - label: "Shortcuts at the bottom of the hero"
                name: "paths"
                widget: "list"
                required: false
                summary: "{{rune}} {{title}}"
                hint: "Up to three quick routes for different visitors (clients, recruiters, fungi people)."
                fields:
                  - { label: "Rune (decoration)", name: "rune", widget: "string", required: false, hint: "One Elder Futhark rune, e.g. ᛚ ᚲ ᛃ ᛗ ᛖ ᚨ ᛞ ᛏ ᛈ" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Short line", name: "text", widget: "string" }
                  - { label: "Link", name: "link", widget: "string", hint: "e.g. #microbiology, #projects, #mycology" }

          - label: "About section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Main paragraph", name: "body", widget: "text" }
              - { label: "Portrait photo (optional)", name: "portrait", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Shown cropped to portrait format (4:5)." }
              - label: "Credentials list"
                name: "credentials"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }

          - label: "Services section (Indoor Microbiology)"
            name: "services"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "Process cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Small tag (e.g. 01 · On-site)", name: "tag", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
              - { label: "Offers heading", name: "offersHeading", widget: "string" }
              - label: "Offers (what clients can buy)"
                name: "offers"
                widget: "list"
                required: false
                hint: "The first offer is shown as a wide band above the others — a good place for the free first call."
                summary: "{{title}} — {{price}}"
                fields:
                  - { label: "Name", name: "title", widget: "string" }
                  - { label: "Who it's for", name: "audience", widget: "text", required: false }
                  - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                  - { label: "Turnaround (optional)", name: "turnaround", widget: "string", required: false, hint: "e.g. Report within 5 working days. Leave empty to hide." }
                  - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. From DKK 2.500 incl. moms. Leave empty to show the fallback text below." }
              - { label: "Text shown when an offer has no price", name: "priceFallback", widget: "string" }

          - label: "Cases & references (hidden until you add something)"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph (optional)", name: "intro", widget: "text", required: false }
              - label: "Case studies (anonymised)"
                name: "cases"
                widget: "list"
                required: false
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string", hint: "e.g. Musty smell in a 1930s basement flat" }
                  - { label: "The problem", name: "problem", widget: "text", required: false }
                  - { label: "What I found", name: "finding", widget: "text", required: false }
                  - { label: "Outcome", name: "outcome", widget: "text", required: false }
              - label: "Testimonials (real clients, with their permission)"
                name: "testimonials"
                widget: "list"
                required: false
                summary: "{{name}}"
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Name / description", name: "name", widget: "string", required: false, hint: "e.g. Homeowner, Frederiksberg" }
              - { label: "Example report (PDF, optional)", name: "sampleReport", widget: "file", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "An anonymised sample report clients can look at." }
              - { label: "Example report button text", name: "sampleReportLabel", widget: "string" }

          - label: "Research & projects section"
            name: "projects"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph (optional)", name: "intro", widget: "text", required: false }
              - label: "Projects"
                name: "items"
                widget: "list"
                summary: "{{year}} — {{title}}"
                fields:
                  - { label: "Year / label", name: "year", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Link (optional)", name: "link", widget: "string", required: false, hint: "e.g. sporexplore.html or a full https:// link to a paper" }
                  - { label: "Link text", name: "linkLabel", widget: "string", required: false }
              - { label: "CV button text", name: "cvLabel", widget: "string" }
              - { label: "CV button link", name: "cvLink", widget: "string" }
              - { label: "CV PDF button text", name: "cvPdfLabel", widget: "string" }
              - { label: "CV PDF file", name: "cvPdf", widget: "string", required: false, hint: "Path to the PDF, normally cv.pdf. Leave empty to hide the button." }

          - label: "Mycology section"
            name: "mycology"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "List items"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
              - { label: "Portal door: small label", name: "portalEyebrow", widget: "string", hint: "The arched 'door' next to the list. It leads to the Fungi portal page (edit that page further down)." }
              - { label: "Portal door: heading", name: "portalHeading", widget: "string" }
              - { label: "Portal door: short text", name: "portalText", widget: "text" }
              - { label: "Portal door: link text", name: "portalCta", widget: "string" }

          - label: "Photography section (shown only when the gallery has photos)"
            name: "photography"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }

          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }

          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "Phone (optional)", name: "phone", widget: "string", required: false, hint: "e.g. +45 12 34 56 78. Leave empty to hide." }
              - { label: "Service area (optional)", name: "area", widget: "string", required: false, hint: "e.g. Copenhagen and Zealand. Leave empty to hide." }
              - { label: "Booking link (optional)", name: "bookingUrl", widget: "string", required: false, hint: "A Cal.com / Calendly link for the free first call. Leave empty to hide the button." }
              - { label: "Booking button text", name: "bookingLabel", widget: "string" }
              - { label: "Form endpoint (optional)", name: "formEndpoint", widget: "string", required: false, hint: "Your Formspree form URL, e.g. https://formspree.io/f/abcdwxyz. Leave empty and the form opens the visitor's email app instead." }
              - label: "Social / other links"
                name: "socials"
                widget: "list"
                required: false
                summary: "{{label}}"
                hint: "Optional. Add a row per link — e.g. Instagram, LinkedIn, ORCID. Leave empty to show none."
                fields:
                  - { label: "Label (what visitors see)", name: "label", widget: "string", hint: "e.g. LinkedIn" }
                  - { label: "Link", name: "url", widget: "string", hint: "Full address, e.g. https://www.linkedin.com/in/yourname" }

          - label: "Beyond the lab (separate page)"
            name: "exploration"
            widget: "object"
            hint: "Lives on its own page, linked from the footer."
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Second paragraph", name: "body", widget: "text" }

          - label: "Fungi portal (separate page: fungi.html)"
            name: "fungi"
            widget: "object"
            hint: "The page behind the portal door in the Mycology section — growing workshops and mushroom tours."
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "Grow (cultivation teaching)"
                name: "grow"
                widget: "object"
                fields:
                  - { label: "Small label", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Short line on the door at the top", name: "doorText", widget: "string" }
                  - { label: "Intro paragraph", name: "intro", widget: "text" }
                  - label: "Offers"
                    name: "offers"
                    widget: "list"
                    required: false
                    summary: "{{title}} — {{price}}"
                    fields:
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Who it's for", name: "audience", widget: "text", required: false }
                      - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                      - { label: "Duration (optional)", name: "duration", widget: "string", required: false, hint: "e.g. About 3 hours. Leave empty to hide." }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. DKK 450 per person, materials included. Leave empty to show the 'no price' text from the Services section." }
              - label: "Tours"
                name: "tours"
                widget: "object"
                fields:
                  - { label: "Small label", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Short line on the door at the top", name: "doorText", widget: "string" }
                  - { label: "Intro paragraph", name: "intro", widget: "text" }
                  - { label: "Season note (optional)", name: "season", widget: "string", required: false }
                  - label: "Offers"
                    name: "offers"
                    widget: "list"
                    required: false
                    summary: "{{title}} — {{price}}"
                    fields:
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Who it's for", name: "audience", widget: "text", required: false }
                      - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                      - { label: "Duration (optional)", name: "duration", widget: "string", required: false, hint: "e.g. About 3 hours. Leave empty to hide." }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. DKK 450 per person, materials included. Leave empty to show the 'no price' text from the Services section." }
              - label: "Upcoming dates (hidden while empty)"
                name: "dates"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Dates"
                    name: "items"
                    widget: "list"
                    required: false
                    summary: "{{date}} — {{title}}"
                    hint: "Add a row per walk or workshop. Remove past dates yourself."
                    fields:
                      - { label: "Date and time", name: "date", widget: "string", hint: "e.g. Sun 12 Oct, 10:00" }
                      - { label: "What", name: "title", widget: "string", hint: "e.g. Mushroom walk" }
                      - { label: "Where (optional)", name: "place", widget: "string", required: false }
                      - { label: "Booking link (optional)", name: "link", widget: "string", required: false, hint: "e.g. a ticket page. Leave empty and the button opens the contact form instead." }
              - label: "Good to know (questions & answers)"
                name: "practical"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Questions"
                    name: "items"
                    widget: "list"
                    summary: "{{q}}"
                    fields:
                      - { label: "Question", name: "q", widget: "string" }
                      - { label: "Answer", name: "a", widget: "text" }
              - { label: "Contact band heading", name: "contactHeading", widget: "string" }
              - { label: "Contact band intro", name: "contactIntro", widget: "text" }

          - label: "Business details"
            name: "business"
            widget: "object"
            fields:
              - { label: "CVR number (optional)", name: "cvr", widget: "string", required: false, hint: "Shown in the footer once you register a business. Leave empty to hide." }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "\"Beyond the lab\" link text", name: "explorationLabel", widget: "string" }

      - file: "content/home.da.json"
        label: "Forside — Dansk"
        name: "home_da"
        format: "json"
        fields: *homefields

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        format: "json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", media_folder: "/images/gallery", public_folder: "/images/gallery" }
              - { label: "Caption (optional)", name: "caption", widget: "string", required: false }

  - name: "pages"
    label: "Extra Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Content", name: "body", widget: "markdown" }
