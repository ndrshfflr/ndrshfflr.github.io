backend:
  name: github
  repo: ndrshfflr/ndrshfflr.github.io
  branch: main
  # Replace with your own deployed OAuth proxy URL (see setup guide).
  base_url: https://decap-proxy.shhflr.workers.dev
  auth_endpoint: auth

# Where images go by default when uploaded through the CMS.
media_folder: "images/uploads"
public_folder: "/images/uploads"

# No drafts: "Publish" saves straight to the site (one commit, live in a minute or two).
# To get drafts back, add:  publish_mode: editorial_workflow

collections:
  - name: "entry"
    label: "Entry Page (portals)"
    files:
      - file: "content/entry.json"
        label: "Entry Page — English"
        name: "entry"
        format: "json"
        fields: &entryfields
          - { label: "Name", name: "name", widget: "string", hint: "Shown in runes by default; hovering reveals it." }
          - { label: "Title under the name", name: "title", widget: "string", hint: "Separate the parts with  ·  (a middle dot)." }
          - label: "Portals"
            name: "portals"
            widget: "list"
            allow_add: false
            min: 7
            max: 7
            summary: "{{fields.rune}}  {{fields.name}}"
            hint: "The seven worlds around the circle, in order of weight — the first stands at the front."
            fields:
              - { label: "Key", name: "key", widget: "hidden" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Rune", name: "rune", widget: "string", hint: "One long-branch Younger Futhark rune: ᚠ ᚢ ᚦ ᚬ ᚱ ᚴ ᚼ ᚾ ᛁ ᛅ ᛋ ᛏ ᛒ ᛘ ᛚ ᛦ" }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "Where the portal leads, e.g. photography.html. Leave empty to show \"This world is still being built\"." }
          - label: "Small menu under the circle"
            name: "menu"
            widget: "list"
            allow_add: false
            min: 3
            max: 3
            summary: "{{fields.rune}}  {{fields.name}}"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Rune", name: "rune", widget: "string" }
              - { label: "Link", name: "link", widget: "string" }
          - { label: "Inscription behind the circle (runes)", name: "inscription", widget: "string", hint: "Carved in long-branch Younger Futhark; separate words with ᛬. Latin letters are turned into runes automatically." }
          - { label: "What the inscription says", name: "inscriptionMeaning", widget: "string", required: false }
      - file: "content/entry.da.json"
        label: "Entry Page — Danish"
        name: "entry_da"
        format: "json"
        fields: *entryfields

  - name: "home"
    label: "Site texts"
    description: "Your contact details (used by the business card, the CV and search engines) and the texts around the Labdiary and the Field log."
    files:
      - file: "content/home.json"
        label: "Site texts — English"
        name: "home"
        format: "json"
        fields: &homefields
          - label: "Contact details"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "Phone (optional)", name: "phone", widget: "string", required: false, hint: "e.g. +45 12 34 56 78. Leave empty to hide." }
              - label: "Social / other links"
                name: "socials"
                widget: "list"
                required: false
                summary: "{{label}}"
                hint: "Optional. Add a row per link — e.g. Instagram, LinkedIn, ORCID. Leave empty to show none."
                fields:
                  - { label: "Label (what visitors see)", name: "label", widget: "string", hint: "e.g. LinkedIn" }
                  - { label: "Link", name: "url", widget: "string", hint: "Full address, e.g. https://www.linkedin.com/in/yourname" }

          - label: "Labdiary — texts (the posts themselves are under Blog posts)"
            name: "blog"
            widget: "object"
            fields:
              - { label: "Line under the heading", name: "intro", widget: "text" }
              - { label: "Text shown while there are no posts", name: "emptyText", widget: "string" }

          - label: "Field log — texts (the finds themselves are under Field log)"
            name: "fieldlog"
            widget: "object"
            fields:
              - { label: "Small label above the title", name: "eyebrow", widget: "string" }
              - { label: "Page title", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Text while the log is empty", name: "emptyText", widget: "string" }

      - file: "content/home.da.json"
        label: "Site texts — Dansk"
        name: "home_da"
        format: "json"
        fields: *homefields

  - name: "fieldlog"
    label: "Field log"
    description: "Your finds are pulled in every night from the sites below. Here you choose what is shown and add finds by hand. Changes appear on the page as soon as they are published."
    files:
      - file: "content/fieldlog.json"
        label: "Field log — sources, hiding and your own finds"
        name: "fieldlog"
        format: "json"
        fields:
          - label: "Where to pull finds from"
            name: "sources"
            widget: "object"
            hint: "Publishing a change here starts a new sync straight away (it takes a minute or two)."
            fields:
              - label: "iNaturalist"
                name: "inaturalist"
                widget: "object"
                fields:
                  - { label: "Use iNaturalist", name: "enabled", widget: "boolean", default: true }
                  - { label: "Username", name: "user", widget: "string", required: false, hint: "Your login name, as in inaturalist.org/people/USERNAME. Finds marked captive/cultivated are left out." }
              - label: "Danmarks Svampeatlas"
                name: "svampeatlas"
                widget: "object"
                fields:
                  - { label: "Use Svampeatlas", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your user number or name", name: "userId", widget: "string", required: false, hint: "Your number is 16165 (Pieter Shiffler Carpentier). Your name or initials exactly as on Svampeatlas also work. Only finds where you are the main finder are included." }
              - label: "Arter.dk"
                name: "arter"
                widget: "object"
                fields:
                  - { label: "Use Arter.dk", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your name exactly as Arter.dk shows it as finder", name: "recordedBy", widget: "string", required: false, hint: "Read via GBIF, which copies Arter.dk about once a week. Several names? Put one per line." }
              - label: "DOFbasen"
                name: "dofbasen"
                widget: "object"
                fields:
                  - { label: "Use DOFbasen", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your observer name exactly as on GBIF", name: "recordedBy", widget: "string", required: false, hint: "Name followed by your DOF code in brackets, e.g. Jens Hansen (1234JHA). Read via GBIF, which leaves out the newest ~60 days." }
              - label: "Merlin Bird ID (via eBird)"
                name: "ebird"
                widget: "object"
                fields:
                  - { label: "Use Merlin/eBird", name: "enabled", widget: "boolean", default: true, hint: "Upload your eBird file under \"Merlin / eBird upload\" in the menu on the left." }
          - label: "Options"
            name: "options"
            widget: "object"
            fields:
              - { label: "iNaturalist: only Research Grade finds", name: "researchGradeOnly", widget: "boolean", default: false }
              - { label: "Show place names", name: "showPlaces", widget: "boolean", default: true, hint: "Only a general place name is ever shown — never coordinates." }
              - { label: "Reference photos for species without a photo of my own", name: "referencePhotos", widget: "boolean", default: true, required: false, hint: "An openly licensed photo from iNaturalist, marked \"Ref. photo\" and credited. It disappears as soon as you have a photo of your own (from a find, the gallery or a hand-added find)." }
          - label: "Favourites, photos and stories"
            name: "finds"
            widget: "list"
            required: false
            summary: "{{fields.species}}"
            hint: "One entry per species (a card in the field log). Works for synced finds and for finds you add by hand — those appear in the species list a few minutes after you publish them."
            fields:
              - { label: "Species", name: "species", widget: "relation", collection: "observations", file: "synced", value_field: "species.*.name", search_fields: ["species.*.label"], display_fields: ["species.*.label"] }
              - { label: "Favourite", name: "favourite", widget: "boolean", default: false, required: false, hint: "Shown with a ★ and listed under Favourites." }
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                hint: "Pick any photo already on the site or upload new ones. The first one becomes the card's cover."
                field: { label: "Photo", name: "src", widget: "image", media_folder: "/images/gallery", public_folder: "/images/gallery" }
              - { label: "Cover photo", name: "cover", widget: "string", required: false, hint: "Set by tapping “Use as cover” on a picture in the field log (while signed in). Any picture the species has works. Empty: the first of your own photos, else the newest." }
              - { label: "Write about this find", name: "story", widget: "boolean", default: false, required: false, hint: "Tick and publish: within a minute or two a blog post is made from this find (its photos, dates, places and your note) and linked from the card as \"Read about this find\". Add your own text to it under Blog posts afterwards." }
              - { label: "Its blog post", name: "post", widget: "relation", collection: "posts", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false, hint: "Filled in automatically when the post is made. You can also pick an existing post." }
              - { label: "Note (English)", name: "text", widget: "text", required: false, hint: "Shown when someone opens the card." }
              - { label: "Note (Danish)", name: "textDa", widget: "text", required: false }
          - label: "Hide these finds"
            name: "hide"
            widget: "list"
            required: false
            hint: "Search by date, name or species. The find stays on the source site; it is only left out here."
            field: { label: "Find", name: "id", widget: "relation", collection: "observations", file: "synced", value_field: "items.*.id", search_fields: ["items.*.label"], display_fields: ["items.*.label"] }
          - label: "Hide whole species"
            name: "hideSpecies"
            widget: "list"
            required: false
            field: { label: "Species", name: "name", widget: "relation", collection: "observations", file: "synced", value_field: "species.*.name", search_fields: ["species.*.label"], display_fields: ["species.*.label"] }
          - label: "Cover photos"
            name: "covers"
            widget: "list"
            required: false
            hint: "Pick the find whose photo should be shown on a species' card. Otherwise the newest photo is used."
            field: { label: "Find", name: "id", widget: "relation", collection: "observations", file: "synced", value_field: "items.*.id", search_fields: ["items.*.label"], display_fields: ["items.*.label"] }
          - label: "Goals (progress bars)"
            name: "goals"
            widget: "list"
            required: false
            summary: "{{group}} — {{target}}"
            hint: "Optional, e.g. Birds → 200. Counts species in that group."
            fields:
              - { label: "Group", name: "group", widget: "select", options: [{ label: "Fungi", value: "fungi" }, { label: "Birds", value: "birds" }, { label: "Insects", value: "insects" }, { label: "Spiders & kin", value: "arachnids" }, { label: "Mammals", value: "mammals" }, { label: "Amphibians & reptiles", value: "herps" }, { label: "Fish", value: "fish" }, { label: "Molluscs", value: "molluscs" }, { label: "Plants", value: "plants" }, { label: "Other", value: "other" }] }
              - { label: "Target number of species", name: "target", widget: "number", value_type: "int", min: 1 }
              - { label: "Label (English, optional)", name: "label", widget: "string", required: false, hint: "e.g. Danish breeding birds. Leave empty to use the group name." }
              - { label: "Label (Danish, optional)", name: "labelDa", widget: "string", required: false }
          - label: "Finds I add by hand"
            name: "manual"
            widget: "list"
            required: false
            summary: "{{date}} — {{name}}"
            hint: "For finds that are in none of the sites above — from a notebook, a trip abroad, before you used the apps…"
            fields:
              - { label: "Id", name: "id", widget: "hidden", required: false }
              - { label: "Latin name", name: "name", widget: "string", hint: "Same spelling as elsewhere, so it joins the same species card." }
              - { label: "Common name (English, optional)", name: "common", widget: "string", required: false }
              - { label: "Common name (Danish, optional)", name: "commonDa", widget: "string", required: false }
              - { label: "Group", name: "group", widget: "select", options: [{ label: "Fungi", value: "fungi" }, { label: "Birds", value: "birds" }, { label: "Insects", value: "insects" }, { label: "Spiders & kin", value: "arachnids" }, { label: "Mammals", value: "mammals" }, { label: "Amphibians & reptiles", value: "herps" }, { label: "Fish", value: "fish" }, { label: "Molluscs", value: "molluscs" }, { label: "Plants", value: "plants" }, { label: "Other", value: "other" }] }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Place (optional)", name: "place", widget: "string", required: false, hint: "Keep it general, e.g. Rold Skov or Abisko, Sweden." }
              - label: "Photos (optional)"
                name: "photos"
                widget: "list"
                required: false
                hint: "Pick any photo already on the site or upload your own — as many as you like. The first one becomes the card's cover."
                field: { label: "Photo", name: "src", widget: "image", media_folder: "/images/gallery", public_folder: "/images/gallery" }
              - { label: "Favourite", name: "favourite", widget: "boolean", default: false, required: false }
              - { label: "Write about this find", name: "story", widget: "boolean", default: false, required: false, hint: "Tick and publish: a blog post is made from this find and linked from its card." }
              - { label: "Its blog post", name: "post", widget: "relation", collection: "posts", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false, hint: "Filled in automatically when the post is made." }
              - { label: "Link (optional)", name: "link", widget: "string", required: false }
              - { label: "Note (optional)", name: "notes", widget: "text", required: false }

  - name: "ebird"
    label: "Merlin / eBird upload"
    description: "Merlin saves your birds in eBird, which can't be read automatically. Every now and then: on ebird.org go to My eBird → Download my data, then upload the .zip from the email here (or the MyEBirdData.csv inside it) and publish. Coordinates and notes are removed in your browser before anything is saved."
    files:
      - file: "content/imports/ebird.json"
        label: "eBird data"
        name: "ebird"
        format: "json"
        fields:
          - { label: "eBird file", name: "csv", widget: "ebird-upload", required: false }

  # Read-only list of synced finds — the hide/cover pickers above look things up
  # here. It is regenerated every night, so it is hidden from the menu.
  - name: "observations"
    label: "Synced finds (read-only)"
    hide: true
    editor: { preview: false }
    files:
      - file: "content/observations.json"
        label: "Synced finds"
        name: "synced"
        format: "json"
        fields:
          - { label: "Updated", name: "updated", widget: "string" }
          - label: "Species"
            name: "species"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Finds"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

  # The photography page (content/gallery.json: its photos, albums, field trips,
  # gear, heading line and look) is edited on the page itself: photography.html,
  # Edit (bottom right; signed in, or open photography.html#edit). New photos,
  # finds and posts: upload.html (the Photos page). Not here, so an older form
  # here can never overwrite what was arranged on the page.
  - name: "tools"
    label: "Bioinformatics tools"
    files:
      - file: "content/tools.json"
        label: "Tools (bioinformatics.html)"
        name: "tools"
        format: "json"
        fields:
          - label: "Line under the heading (optional)"
            name: "intro"
            widget: "object"
            required: false
            collapsed: true
            fields:
              - { label: "English", name: "en", widget: "string", required: false }
              - { label: "Danish", name: "da", widget: "string", required: false }
          - label: "Tools"
            name: "tools"
            widget: "list"
            summary: "{{fields.name}} · {{fields.status}}"
            hint: "Drag to change the order. Tools you're still building show as \"Coming\"."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Status", name: "status", widget: "select", default: "live", options: [{ label: "Live — can be opened", value: "live" }, { label: "Coming — still being built", value: "coming" }] }
              - { label: "Link", name: "link", widget: "string", required: false, hint: "e.g. sporexplore.html or a full https:// link. Leave empty for a tool that's coming." }
              - label: "What it does"
                name: "description"
                widget: "object"
                fields:
                  - { label: "English", name: "en", widget: "text", required: false }
                  - { label: "Danish", name: "da", widget: "text", required: false, hint: "Leave empty to show the English text." }

  - name: "cv"
    label: "CV"
    description: "The CV page (cv.html): the mountain, the road and every entry on it. The page's own words (headings, buttons) follow EN/DA by themselves; the entries are shown as written here on both pages."
    files:
      - file: "content/cv.json"
        label: "CV"
        name: "cv"
        fields:
          - { label: "Line under the heading", name: "tagline", widget: "string" }
          - { label: "Introduction", name: "intro", widget: "text" }
          - { label: "Portrait (optional)", name: "portrait", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Shown round, next to the introduction." }
          - { label: "CV PDF file", name: "pdf", widget: "string", required: false, hint: "Normally cv.pdf. Leave empty to hide the Download button." }
          - label: "Current main occupation"
            name: "now"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Place · since", name: "place", widget: "string", required: false }
              - { label: "Logos", name: "logos", widget: "list", required: false, hint: "Keys from Organisations below, comma-separated, e.g. ku or ramboll, ku (up to three)." }
          - label: "Figures at the top"
            name: "figures"
            widget: "list"
            summary: "{{fields.label}} — {{fields.value}}"
            hint: "A figure without a value is hidden. 'Grants won' and 'species recorded' count themselves."
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "Label (Danish)", name: "labelDa", widget: "string", required: false }
              - { label: "Value", name: "value", widget: "string", required: false }
              - { label: "Small line under it", name: "note", widget: "string", required: false }
              - { label: "Small line (Danish)", name: "noteDa", widget: "string", required: false }
              - { label: "Counts itself", name: "auto", widget: "select", required: false, options: [{ label: "No", value: "" }, { label: "Grants (from the Grants entries)", value: "grants" }, { label: "Species (from the field log)", value: "species" }] }
          - label: "Strengths (the radar)"
            name: "strengths"
            widget: "list"
            summary: "{{fields.label}} — {{fields.score}}"
            hint: "Each point on the radar. 'Everything' shows all of them; tick the lenses a point also shows in. A dip is drawn hollow, in italics."
            fields:
              - { label: "Label (one or two words)", name: "label", widget: "string" }
              - { label: "Label (Danish)", name: "labelDa", widget: "string", required: false }
              - { label: "Full name (on hover)", name: "long", widget: "string", required: false }
              - { label: "Full name (Danish)", name: "longDa", widget: "string", required: false }
              - { label: "Score (1–5)", name: "score", widget: "number", value_type: "int", min: 1, max: 5 }
              - { label: "Dip (less my thing)", name: "dip", widget: "boolean", default: false }
              - { label: "Also in these lenses", name: "lenses", widget: "select", multiple: true, required: false, options: [{ label: "Researcher", value: "researcher" }, { label: "Consultant", value: "consultant" }, { label: "Guide", value: "guide" }] }
              - { label: "Story behind it (blog post)", name: "story", widget: "relation", collection: "posts", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false }
          - label: "Organisations (logos)"
            name: "organisations"
            widget: "list"
            summary: "{{fields.key}} — {{fields.name}}"
            fields:
              - { label: "Key (short, used in entries)", name: "key", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Letters shown until a logo is added", name: "abbr", widget: "string", required: false }
              - { label: "Logo (optional)", name: "logo", widget: "image", required: false, media_folder: "/images/logos", public_folder: "/images/logos", hint: "Square-ish PNG or SVG on a transparent or white background. Check the organisation's rules for using its logo." }
          - label: "Courses"
            name: "courses"
            widget: "list"
            summary: "{{fields.name}} — {{fields.rating}}"
            hint: "Courses shown as hover cards: under a degree (Key courses), as 'Built on' tags on an entry, or as an entry's own title."
            fields:
              - { label: "Key (short, used in entries)", name: "key", widget: "string" }
              - { label: "Name", name: "name", widget: "string" }
              - { label: "ECTS", name: "ects", widget: "string", required: false }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "Degree", name: "degree", widget: "string", required: false, hint: "e.g. MSc Ecology" }
              - { label: "Proficiency (1–5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, required: false }
              - { label: "What I learned or made", name: "summary", widget: "text", required: false }
              - { label: "Used in", name: "usedIn", widget: "string", required: false, hint: "e.g. Student Assistant, Indoor Climate Lab" }
          - label: "Entries"
            name: "entries"
            widget: "list"
            summary: "{{fields.section}} · {{fields.year}} · {{fields.title}}"
            hint: "In the order they appear. Within each section they alternate left and right of the road."
            fields:
              - { label: "Section", name: "section", widget: "select", options: [{ label: "Education", value: "education" }, { label: "Work", value: "work" }, { label: "Volunteering", value: "volunteering" }, { label: "Grants & Funding", value: "grants" }, { label: "Research", value: "research" }, { label: "Presentations & Outreach", value: "presentations" }] }
              - { label: "Year(s)", name: "year", widget: "string", required: false }
              - { label: "Title", name: "title", widget: "string", hint: "Put species names between *stars* for italics." }
              - { label: "Detail line", name: "detail", widget: "text", required: false }
              - { label: "Amount (grants)", name: "amount", widget: "string", required: false, hint: "e.g. 7,125 DKK — counted in 'grants won'." }
              - { label: "Current (filled marker)", name: "current", widget: "boolean", default: false, required: false }
              - { label: "Shown strongly for", name: "lenses", widget: "select", multiple: true, required: false, options: [{ label: "Researcher", value: "researcher" }, { label: "Consultant", value: "consultant" }, { label: "Guide", value: "guide" }], hint: "The 'View as' buttons dim entries that aren't ticked for that reader." }
              - { label: "Logos", name: "logos", widget: "list", required: false, hint: "Keys from Organisations, comma-separated, up to three, e.g. funga, sse, ku" }
              - { label: "Blog post (hover preview)", name: "post", widget: "relation", collection: "posts", value_field: "{{slug}}", search_fields: ["title"], display_fields: ["title"], required: false, hint: "Not used for Education." }
              - { label: "Course card on the title", name: "course", widget: "string", required: false, hint: "A course key, e.g. for a single course like the PhD course." }
              - { label: "Key courses (under a degree)", name: "keyCourses", widget: "list", required: false, hint: "Course keys, comma-separated." }
              - { label: "Built on (course tags)", name: "builtOn", widget: "list", required: false, hint: "Course keys, comma-separated." }
              - { label: "Small image (optional)", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads" }
              - { label: "Image description", name: "imageAlt", widget: "string", required: false }

  - name: "posts"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Field notes, finds, projects. Newest first in the Labdiary."
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    view_filters:
      - { label: "English", field: "language", pattern: "en" }
      - { label: "Danish", field: "language", pattern: "da" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Language", name: "language", widget: "select", options: [{ label: "English", value: "en" }, { label: "Dansk", value: "da" }], default: "en" }
      - { label: "Summary", name: "summary", widget: "text", required: false, hint: "One or two sentences, shown on the post cards and under the title." }
      - { label: "Cover photo (optional)", name: "cover", widget: "image", required: false, media_folder: "/images/blog", public_folder: "/images/blog", hint: "Landscape works best. Without one, the card shows a carved rune." }
      - { label: "Topics (optional)", name: "tags", widget: "list", required: false, hint: "Comma-separated, e.g. Fungi, Foraging, Terrarium. Used for the filter buttons on the blog page." }
      - { label: "Text", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: ["image"] }
