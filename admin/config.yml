backend:
  name: github
  repo: ndrshfflr/ndrshfflr.github.io
  branch: main
  # Replace with your own deployed OAuth proxy URL (see setup guide).
  base_url: https://decap-proxy.shhflr.workers.dev
  auth_endpoint: auth

# Where images go by default when uploaded through the CMS.
media_folder: "images/uploads"
public_folder: "/images/uploads"

publish_mode: editorial_workflow

collections:
  - name: "home"
    label: "Main Page"
    files:
      - file: "content/home.json"
        label: "Main Page — English"
        name: "home"
        format: "json"
        fields: &homefields
          - label: "Navigation menu labels"
            name: "nav"
            widget: "object"
            hint: "The links in the top menu. These stay pointed at the same sections — you're only changing the visible label text. (The CV link appears automatically from Extra Pages.)"
            fields:
              - { label: "\"About\" label", name: "about", widget: "string" }
              - { label: "\"Indoor Microbiology\" label", name: "microbiology", widget: "string" }
              - { label: "\"Projects\" label", name: "projects", widget: "string" }
              - { label: "\"Mycology\" label", name: "mycology", widget: "string" }
              - { label: "\"Blog\" label", name: "blog", widget: "string", hint: "Shown once the blog has at least one post." }
              - { label: "\"Contact\" label", name: "contact", widget: "string" }

          - label: "Hero (top of page)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Background photo", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Landscape, about 2000 px wide and under ~500 KB. The left/bottom is darkened so the headline stays readable. On the Danish page, leave empty to use the English photo." }
              - { label: "Photo description (for screen readers)", name: "imageAlt", widget: "string", required: false, hint: "e.g. Fruiting bodies of … on a beech log" }
              - { label: "Small label above headline", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Paragraph under headline", name: "lead", widget: "text" }
              - { label: "Primary button text", name: "primaryCtaLabel", widget: "string" }
              - { label: "Primary button link", name: "primaryCtaLink", widget: "string", hint: "e.g. #contact or a full https:// link" }
              - { label: "Secondary button text", name: "secondaryCtaLabel", widget: "string" }
              - { label: "Secondary button link", name: "secondaryCtaLink", widget: "string" }
              - label: "Shortcuts at the bottom of the hero"
                name: "paths"
                widget: "list"
                required: false
                summary: "{{rune}} {{title}}"
                hint: "Up to three quick routes for different visitors (clients, recruiters, fungi people)."
                fields:
                  - { label: "Rune (decoration)", name: "rune", widget: "string", required: false, hint: "One Elder Futhark rune, e.g. ᛚ ᚲ ᛃ ᛗ ᛖ ᚨ ᛞ ᛏ ᛈ" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Short line", name: "text", widget: "string" }
                  - { label: "Link", name: "link", widget: "string", hint: "e.g. #microbiology, #projects, #mycology" }

          - label: "About section"
            name: "about"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Main paragraph", name: "body", widget: "text" }
              - { label: "Portrait photo (optional)", name: "portrait", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Shown cropped to portrait format (4:5)." }
              - label: "Credentials list"
                name: "credentials"
                widget: "list"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }

          - label: "Services section (Indoor Microbiology)"
            name: "services"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "Process cards"
                name: "cards"
                widget: "list"
                fields:
                  - { label: "Small tag (e.g. 01 · On-site)", name: "tag", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "text", widget: "text" }
              - { label: "Offers heading", name: "offersHeading", widget: "string" }
              - label: "Offers (what clients can buy)"
                name: "offers"
                widget: "list"
                required: false
                hint: "The first offer is shown as a wide band above the others — a good place for the free first call."
                summary: "{{title}} — {{price}}"
                fields:
                  - { label: "Name", name: "title", widget: "string" }
                  - { label: "Who it's for", name: "audience", widget: "text", required: false }
                  - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                  - { label: "Turnaround (optional)", name: "turnaround", widget: "string", required: false, hint: "e.g. Report within 5 working days. Leave empty to hide." }
                  - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. From DKK 2.500 incl. moms. Leave empty to show the fallback text below." }
              - { label: "Text shown when an offer has no price", name: "priceFallback", widget: "string" }

          - label: "Cases & references (hidden until you add something)"
            name: "trust"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph (optional)", name: "intro", widget: "text", required: false }
              - label: "Case studies (anonymised)"
                name: "cases"
                widget: "list"
                required: false
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string", hint: "e.g. Musty smell in a 1930s basement flat" }
                  - { label: "The problem", name: "problem", widget: "text", required: false }
                  - { label: "What I found", name: "finding", widget: "text", required: false }
                  - { label: "Outcome", name: "outcome", widget: "text", required: false }
              - label: "Testimonials (real clients, with their permission)"
                name: "testimonials"
                widget: "list"
                required: false
                summary: "{{name}}"
                fields:
                  - { label: "Quote", name: "quote", widget: "text" }
                  - { label: "Name / description", name: "name", widget: "string", required: false, hint: "e.g. Homeowner, Frederiksberg" }
              - { label: "Example report (PDF, optional)", name: "sampleReport", widget: "file", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "An anonymised sample report clients can look at." }
              - { label: "Example report button text", name: "sampleReportLabel", widget: "string" }

          - label: "Research & projects section"
            name: "projects"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph (optional)", name: "intro", widget: "text", required: false }
              - label: "Projects"
                name: "items"
                widget: "list"
                summary: "{{year}} — {{title}}"
                fields:
                  - { label: "Year / label", name: "year", widget: "string" }
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - { label: "Link (optional)", name: "link", widget: "string", required: false, hint: "e.g. sporexplore.html or a full https:// link to a paper" }
                  - { label: "Link text", name: "linkLabel", widget: "string", required: false }
              - { label: "CV button text", name: "cvLabel", widget: "string" }
              - { label: "CV button link", name: "cvLink", widget: "string" }
              - { label: "CV PDF button text", name: "cvPdfLabel", widget: "string" }
              - { label: "CV PDF file", name: "cvPdf", widget: "string", required: false, hint: "Path to the PDF, normally cv.pdf. Leave empty to hide the button." }

          - label: "Mycology section"
            name: "mycology"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "List items"
                name: "list"
                widget: "list"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
              - { label: "Portal door: small label", name: "portalEyebrow", widget: "string", hint: "The arched 'door' next to the list. It leads to the Fungi portal page (edit that page further down)." }
              - { label: "Portal door: heading", name: "portalHeading", widget: "string" }
              - { label: "Portal door: short text", name: "portalText", widget: "text" }
              - { label: "Portal door: link text", name: "portalCta", widget: "string" }

          - label: "Photography section (shown only when the gallery has photos)"
            name: "photography"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }

          - label: "FAQ"
            name: "faq"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - label: "Questions"
                name: "items"
                widget: "list"
                summary: "{{q}}"
                fields:
                  - { label: "Question", name: "q", widget: "string" }
                  - { label: "Answer", name: "a", widget: "text" }

          - label: "Contact section"
            name: "contact"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Email address", name: "email", widget: "string" }
              - { label: "Phone (optional)", name: "phone", widget: "string", required: false, hint: "e.g. +45 12 34 56 78. Leave empty to hide." }
              - { label: "Service area (optional)", name: "area", widget: "string", required: false, hint: "e.g. Copenhagen and Zealand. Leave empty to hide." }
              - { label: "Booking link (optional)", name: "bookingUrl", widget: "string", required: false, hint: "A Cal.com / Calendly link for the free first call. Leave empty to hide the button." }
              - { label: "Booking button text", name: "bookingLabel", widget: "string" }
              - { label: "Form endpoint (optional)", name: "formEndpoint", widget: "string", required: false, hint: "Your Formspree form URL, e.g. https://formspree.io/f/abcdwxyz. Leave empty and the form opens the visitor's email app instead." }
              - label: "Social / other links"
                name: "socials"
                widget: "list"
                required: false
                summary: "{{label}}"
                hint: "Optional. Add a row per link — e.g. Instagram, LinkedIn, ORCID. Leave empty to show none."
                fields:
                  - { label: "Label (what visitors see)", name: "label", widget: "string", hint: "e.g. LinkedIn" }
                  - { label: "Link", name: "url", widget: "string", hint: "Full address, e.g. https://www.linkedin.com/in/yourname" }

          - label: "Beyond the lab (separate page)"
            name: "exploration"
            widget: "object"
            hint: "Lives on its own page, linked from the footer."
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - { label: "Second paragraph", name: "body", widget: "text" }

          - label: "Fungi portal (separate page: fungi.html)"
            name: "fungi"
            widget: "object"
            hint: "The page behind the portal door in the Mycology section — growing workshops and mushroom tours."
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Intro paragraph", name: "intro", widget: "text" }
              - label: "Grow (cultivation teaching)"
                name: "grow"
                widget: "object"
                fields:
                  - { label: "Small label", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Short line on the door at the top", name: "doorText", widget: "string" }
                  - { label: "Intro paragraph", name: "intro", widget: "text" }
                  - label: "Offers"
                    name: "offers"
                    widget: "list"
                    required: false
                    summary: "{{title}} — {{price}}"
                    fields:
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Who it's for", name: "audience", widget: "text", required: false }
                      - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                      - { label: "Duration (optional)", name: "duration", widget: "string", required: false, hint: "e.g. About 3 hours. Leave empty to hide." }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. DKK 450 per person, materials included. Leave empty to show the 'no price' text from the Services section." }
              - label: "Tours"
                name: "tours"
                widget: "object"
                fields:
                  - { label: "Small label", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Short line on the door at the top", name: "doorText", widget: "string" }
                  - { label: "Intro paragraph", name: "intro", widget: "text" }
                  - { label: "Season note (optional)", name: "season", widget: "string", required: false }
                  - label: "Offers"
                    name: "offers"
                    widget: "list"
                    required: false
                    summary: "{{title}} — {{price}}"
                    fields:
                      - { label: "Name", name: "title", widget: "string" }
                      - { label: "Who it's for", name: "audience", widget: "text", required: false }
                      - { label: "What's included (one item per line)", name: "includes", widget: "text", required: false }
                      - { label: "Duration (optional)", name: "duration", widget: "string", required: false, hint: "e.g. About 3 hours. Leave empty to hide." }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. DKK 450 per person, materials included. Leave empty to show the 'no price' text from the Services section." }
              - label: "Culture library (hidden until you add a culture)"
                name: "library"
                widget: "object"
                fields:
                  - { label: "Small label", name: "eyebrow", widget: "string" }
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Short line on the door at the top", name: "doorText", widget: "string" }
                  - { label: "Intro paragraph", name: "intro", widget: "text" }
                  - { label: "How ordering works (optional)", name: "orderNote", widget: "text", required: false, hint: "Shipping, delivery time, what the buyer receives." }
                  - label: "Cultures"
                    name: "items"
                    widget: "list"
                    required: false
                    summary: "{{name}} — {{price}}"
                    fields:
                      - { label: "Species (Latin name)", name: "name", widget: "string", hint: "Shown in italics, e.g. Pleurotus ostreatus" }
                      - { label: "Common name (optional)", name: "common", widget: "string", required: false, hint: "e.g. Oyster mushroom / Østershat" }
                      - { label: "Photo (optional)", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Square works best — shown as a round petri dish. Without a photo, a drawn agar plate is shown." }
                      - { label: "Origin (optional)", name: "origin", widget: "string", required: false, hint: "e.g. Wild-collected, North Zealand, 2025" }
                      - { label: "Format (optional)", name: "format", widget: "string", required: false, hint: "e.g. Agar plate, liquid culture 10 ml, grain spawn 1 kg" }
                      - { label: "Notes (optional)", name: "notes", widget: "text", required: false }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false, hint: "e.g. DKK 150 incl. shipping" }
                      - { label: "Available", name: "available", widget: "boolean", default: true, required: false, hint: "Switch off to show it as not available right now." }
                      - { label: "Payment link (optional)", name: "buyLink", widget: "string", required: false, hint: "e.g. a Stripe Payment Link or MobilePay link. Leave empty and the button opens the contact form with the culture filled in." }
              - label: "Upcoming dates (hidden while empty)"
                name: "dates"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Dates"
                    name: "items"
                    widget: "list"
                    required: false
                    summary: "{{date}} — {{title}}"
                    hint: "Add a row per walk or workshop. Remove past dates yourself."
                    fields:
                      - { label: "Date and time", name: "date", widget: "string", hint: "e.g. Sun 12 Oct, 10:00" }
                      - { label: "What", name: "title", widget: "string", hint: "e.g. Mushroom walk" }
                      - { label: "Where (optional)", name: "place", widget: "string", required: false }
                      - { label: "Booking link (optional)", name: "link", widget: "string", required: false, hint: "e.g. a ticket page. Leave empty and the button opens the contact form instead." }
              - label: "Good to know (questions & answers)"
                name: "practical"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - label: "Questions"
                    name: "items"
                    widget: "list"
                    summary: "{{q}}"
                    fields:
                      - { label: "Question", name: "q", widget: "string" }
                      - { label: "Answer", name: "a", widget: "text" }
              - { label: "Contact band heading", name: "contactHeading", widget: "string" }
              - { label: "Contact band intro", name: "contactIntro", widget: "text" }

          - label: "Insects & terrariums (separate page: terrarium.html)"
            name: "terrarium"
            widget: "object"
            hint: "The door on the main page (under Mycology) and the page behind it. Sections stay hidden until they have at least one entry."
            fields:
              - { label: "Main-page door: small label", name: "teaserEyebrow", widget: "string" }
              - { label: "Main-page door: heading", name: "teaserHeading", widget: "string" }
              - { label: "Main-page door: short text", name: "teaserText", widget: "text" }
              - { label: "Main-page door: link text", name: "teaserCta", widget: "string" }
              - { label: "Page: small label", name: "eyebrow", widget: "string" }
              - { label: "Page: heading", name: "heading", widget: "string" }
              - { label: "Page: intro paragraph", name: "intro", widget: "text" }
              - { label: "Page: small note (optional)", name: "note", widget: "string", required: false, hint: "e.g. 'Care guides and animals for sale are on their way.' Leave empty to hide." }
              - label: "Terrariums"
                name: "tanks"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - label: "Terrariums"
                    name: "items"
                    widget: "list"
                    required: false
                    summary: "{{name}}"
                    fields:
                      - { label: "Name", name: "name", widget: "string", hint: "e.g. The leaf tank" }
                      - { label: "Photo (optional)", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Landscape (4:3) works best." }
                      - { label: "Size (optional)", name: "size", widget: "string", required: false, hint: "e.g. 45 × 45 × 60 cm" }
                      - { label: "How it's built (optional)", name: "setup", widget: "text", required: false, hint: "Substrate, plants, ventilation, humidity, cleanup crew…" }
                      - { label: "Who lives here (optional)", name: "inhabitants", widget: "string", required: false }
              - label: "Species"
                name: "species"
                widget: "object"
                fields:
                  - { label: "Heading", name: "heading", widget: "string" }
                  - { label: "Intro", name: "intro", widget: "text" }
                  - label: "Species"
                    name: "items"
                    widget: "list"
                    required: false
                    summary: "{{group}} — {{name}}"
                    fields:
                      - { label: "Latin name", name: "name", widget: "string", hint: "Shown in italics" }
                      - { label: "Common name (optional)", name: "common", widget: "string", required: false }
                      - { label: "Group (optional)", name: "group", widget: "string", required: false, hint: "e.g. Stick insect, Isopod, Beetle" }
                      - { label: "Photo (optional)", name: "image", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Square works best." }
                      - { label: "Notes (optional)", name: "notes", widget: "text", required: false }
                      - { label: "Care guide link (optional)", name: "careGuide", widget: "string", required: false, hint: "For later: write the guide under Extra Pages, then put e.g. page.html?slug=isopod-care here." }
                      - { label: "For sale", name: "forSale", widget: "boolean", default: false, required: false, hint: "For later: switch on to show a price and a buy/ask button." }
                      - { label: "Price (optional)", name: "price", widget: "string", required: false }
                      - { label: "Payment link (optional)", name: "buyLink", widget: "string", required: false, hint: "Leave empty and the button opens the contact form instead." }
              - { label: "Contact band heading", name: "contactHeading", widget: "string" }
              - { label: "Contact band intro", name: "contactIntro", widget: "text" }

          - label: "Field log — texts (the finds themselves are under Field log)"
            name: "fieldlog"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Door on the main page — small label", name: "teaserEyebrow", widget: "string" }
              - { label: "Door on the main page — title", name: "teaserHeading", widget: "string" }
              - { label: "Door on the main page — text", name: "teaserText", widget: "text" }
              - { label: "Door on the main page — link text", name: "teaserCta", widget: "string" }
              - { label: "Small label above the title", name: "eyebrow", widget: "string" }
              - { label: "Page title", name: "heading", widget: "string" }
              - { label: "Intro", name: "intro", widget: "text" }
              - { label: "Text while the log is empty", name: "emptyText", widget: "string" }

          - label: "Blog (texts around the posts — the posts themselves are under Blog posts)"
            name: "blog"
            widget: "object"
            fields:
              - { label: "Small label", name: "eyebrow", widget: "string" }
              - { label: "Blog page heading", name: "heading", widget: "string" }
              - { label: "Blog page intro", name: "intro", widget: "text" }
              - { label: "Heading above the latest posts on the main page", name: "latestHeading", widget: "string" }
              - { label: "Text shown while there are no posts", name: "emptyText", widget: "string" }

          - label: "Business details"
            name: "business"
            widget: "object"
            fields:
              - { label: "CVR number (optional)", name: "cvr", widget: "string", required: false, hint: "Shown in the footer once you register a business. Leave empty to hide." }

          - label: "Footer"
            name: "footer"
            widget: "object"
            fields:
              - { label: "Tagline", name: "tagline", widget: "string" }
              - { label: "\"Beyond the lab\" link text", name: "explorationLabel", widget: "string" }

      - file: "content/home.da.json"
        label: "Forside — Dansk"
        name: "home_da"
        format: "json"
        fields: *homefields

  - name: "fieldlog"
    label: "Field log"
    description: "Your finds are pulled in every night from the sites below. Here you choose what is shown and add finds by hand. Changes appear on the page as soon as they are published."
    files:
      - file: "content/fieldlog.json"
        label: "Field log — sources, hiding and your own finds"
        name: "fieldlog"
        format: "json"
        fields:
          - label: "Where to pull finds from"
            name: "sources"
            widget: "object"
            hint: "Publishing a change here starts a new sync straight away (it takes a minute or two)."
            fields:
              - label: "iNaturalist"
                name: "inaturalist"
                widget: "object"
                fields:
                  - { label: "Use iNaturalist", name: "enabled", widget: "boolean", default: true }
                  - { label: "Username", name: "user", widget: "string", required: false, hint: "Your login name, as in inaturalist.org/people/USERNAME. Finds marked captive/cultivated are left out." }
              - label: "Danmarks Svampeatlas"
                name: "svampeatlas"
                widget: "object"
                fields:
                  - { label: "Use Svampeatlas", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your user number or name", name: "userId", widget: "string", required: false, hint: "Your number is 16165 (Pieter Shiffler Carpentier). Your name or initials exactly as on Svampeatlas also work. Only finds where you are the main finder are included." }
              - label: "Arter.dk"
                name: "arter"
                widget: "object"
                fields:
                  - { label: "Use Arter.dk", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your name exactly as Arter.dk shows it as finder", name: "recordedBy", widget: "string", required: false, hint: "Read via GBIF, which copies Arter.dk about once a week. Several names? Put one per line." }
              - label: "DOFbasen"
                name: "dofbasen"
                widget: "object"
                fields:
                  - { label: "Use DOFbasen", name: "enabled", widget: "boolean", default: true }
                  - { label: "Your observer name exactly as on GBIF", name: "recordedBy", widget: "string", required: false, hint: "Name followed by your DOF code in brackets, e.g. Jens Hansen (1234JHA). Read via GBIF, which leaves out the newest ~60 days." }
              - label: "Merlin Bird ID (via eBird)"
                name: "ebird"
                widget: "object"
                fields:
                  - { label: "Use Merlin/eBird", name: "enabled", widget: "boolean", default: true }
                  - { label: "Cleaned eBird file", name: "file", widget: "file", required: false, media_folder: "/content/imports", public_folder: "/content/imports", hint: "Merlin saves your birds in eBird, which has no automatic link. 1) ebird.org → My eBird → Download my data (arrives by email). 2) Open ndrshfflr.github.io/fieldlog-import.html and run the file through it — it removes coordinates. 3) Upload the cleaned file here. Repeat now and then to bring in new birds. Never upload the original file: it holds exact coordinates and the site's files are public." }
          - label: "Options"
            name: "options"
            widget: "object"
            fields:
              - { label: "iNaturalist: only Research Grade finds", name: "researchGradeOnly", widget: "boolean", default: false }
              - { label: "Show place names", name: "showPlaces", widget: "boolean", default: true, hint: "Only a general place name is ever shown — never coordinates." }
          - label: "Hide these finds"
            name: "hide"
            widget: "list"
            required: false
            hint: "Search by date, name or species. The find stays on the source site; it is only left out here."
            field: { label: "Find", name: "id", widget: "relation", collection: "observations", file: "synced", value_field: "items.*.id", search_fields: ["items.*.label"], display_fields: ["items.*.label"] }
          - label: "Hide whole species"
            name: "hideSpecies"
            widget: "list"
            required: false
            field: { label: "Species", name: "name", widget: "relation", collection: "observations", file: "synced", value_field: "species.*.name", search_fields: ["species.*.label"], display_fields: ["species.*.label"] }
          - label: "Cover photos"
            name: "covers"
            widget: "list"
            required: false
            hint: "Pick the find whose photo should be shown on a species' card. Otherwise the newest photo is used."
            field: { label: "Find", name: "id", widget: "relation", collection: "observations", file: "synced", value_field: "items.*.id", search_fields: ["items.*.label"], display_fields: ["items.*.label"] }
          - label: "Notes on a species"
            name: "notes"
            widget: "list"
            required: false
            summary: "{{species}}"
            hint: "Shown when someone opens the species. Also works for finds you add by hand — type the Latin name exactly."
            fields:
              - { label: "Species (Latin name)", name: "species", widget: "string" }
              - { label: "Note (English)", name: "text", widget: "text", required: false }
              - { label: "Note (Danish)", name: "textDa", widget: "text", required: false }
          - label: "Goals (progress bars)"
            name: "goals"
            widget: "list"
            required: false
            summary: "{{group}} — {{target}}"
            hint: "Optional, e.g. Birds → 200. Counts species in that group."
            fields:
              - { label: "Group", name: "group", widget: "select", options: [{ label: "Fungi", value: "fungi" }, { label: "Birds", value: "birds" }, { label: "Insects", value: "insects" }, { label: "Spiders & kin", value: "arachnids" }, { label: "Mammals", value: "mammals" }, { label: "Amphibians & reptiles", value: "herps" }, { label: "Fish", value: "fish" }, { label: "Molluscs", value: "molluscs" }, { label: "Plants", value: "plants" }, { label: "Other", value: "other" }] }
              - { label: "Target number of species", name: "target", widget: "number", value_type: "int", min: 1 }
              - { label: "Label (English, optional)", name: "label", widget: "string", required: false, hint: "e.g. Danish breeding birds. Leave empty to use the group name." }
              - { label: "Label (Danish, optional)", name: "labelDa", widget: "string", required: false }
          - label: "Finds I add by hand"
            name: "manual"
            widget: "list"
            required: false
            summary: "{{date}} — {{name}}"
            hint: "For finds that are in none of the sites above — from a notebook, a trip abroad, before you used the apps…"
            fields:
              - { label: "Latin name", name: "name", widget: "string", hint: "Same spelling as elsewhere, so it joins the same species card." }
              - { label: "Common name (English, optional)", name: "common", widget: "string", required: false }
              - { label: "Common name (Danish, optional)", name: "commonDa", widget: "string", required: false }
              - { label: "Group", name: "group", widget: "select", options: [{ label: "Fungi", value: "fungi" }, { label: "Birds", value: "birds" }, { label: "Insects", value: "insects" }, { label: "Spiders & kin", value: "arachnids" }, { label: "Mammals", value: "mammals" }, { label: "Amphibians & reptiles", value: "herps" }, { label: "Fish", value: "fish" }, { label: "Molluscs", value: "molluscs" }, { label: "Plants", value: "plants" }, { label: "Other", value: "other" }] }
              - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
              - { label: "Place (optional)", name: "place", widget: "string", required: false, hint: "Keep it general, e.g. Rold Skov or Abisko, Sweden." }
              - { label: "Photo (optional)", name: "photo", widget: "image", required: false, media_folder: "/images/uploads", public_folder: "/images/uploads", hint: "Square-ish works best. A photo added here becomes the card's cover." }
              - { label: "Link (optional)", name: "link", widget: "string", required: false }
              - { label: "Note (optional)", name: "notes", widget: "text", required: false }

  # Read-only list of synced finds — the hide/cover pickers above look things up
  # here. It is regenerated every night, so it is hidden from the menu.
  - name: "observations"
    label: "Synced finds (read-only)"
    hide: true
    editor: { preview: false }
    files:
      - file: "content/observations.json"
        label: "Synced finds"
        name: "synced"
        format: "json"
        fields:
          - { label: "Updated", name: "updated", widget: "string" }
          - label: "Species"
            name: "species"
            widget: "list"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }
          - label: "Finds"
            name: "items"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "Label", name: "label", widget: "string" }

  - name: "gallery"
    label: "Photo Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        format: "json"
        fields:
          - label: "Photos"
            name: "images"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "image", widget: "image", media_folder: "/images/gallery", public_folder: "/images/gallery" }
              - { label: "Caption (optional)", name: "caption", widget: "string", required: false }

  - name: "posts"
    label: "Blog posts"
    label_singular: "Blog post"
    description: "Field notes, finds, projects. Newest first on the blog page; the three newest also appear on the main page."
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    sortable_fields: ["date", "title"]
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    view_filters:
      - { label: "English", field: "language", pattern: "en" }
      - { label: "Danish", field: "language", pattern: "da" }
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { label: "Language", name: "language", widget: "select", options: [{ label: "English", value: "en" }, { label: "Dansk", value: "da" }], default: "en" }
      - { label: "Summary", name: "summary", widget: "text", required: false, hint: "One or two sentences, shown on the post cards and under the title." }
      - { label: "Cover photo (optional)", name: "cover", widget: "image", required: false, media_folder: "/images/blog", public_folder: "/images/blog", hint: "Landscape works best. Without one, the card shows a carved rune." }
      - { label: "Topics (optional)", name: "tags", widget: "list", required: false, hint: "Comma-separated, e.g. Fungi, Foraging, Terrarium. Used for the filter buttons on the blog page." }
      - { label: "Text", name: "body", widget: "markdown", buttons: ["bold", "italic", "link", "heading-two", "heading-three", "quote", "bulleted-list", "numbered-list"], editor_components: ["image"] }

  - name: "pages"
    label: "Extra Pages"
    folder: "content/pages"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Content", name: "body", widget: "markdown" }
